<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинякин Александр Сергеевич — НПФ ЭИТЭК</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --item: #f5f9ff;
            --accent: #2563eb;
            --accent-light: rgba(37, 99, 235, 0.08);
            --accent-gradient: linear-gradient(135deg, #2563eb, #3b82f6);
            --text: #1e293b;
            --text-sec: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #f8fbff 0%, #f0f7ff 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .company-logo {
            height: 36px;
            width: auto;
            flex-shrink: 0;
        }

        .company-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sec);
            letter-spacing: 0.5px;
        }

        .profile {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .photo-wrap {
            position: relative;
            width: 70px;
            height: 70px;
            flex-shrink: 0;
        }

        .photo-ring {
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: var(--accent-gradient);
        }

        .photo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--card);
            position: relative;
            z-index: 1;
        }

        .photo-fallback {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--card);
            background: var(--accent-light);
            display: none;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .photo-fallback svg { width: 28px; height: 28px; color: var(--accent); }

        .status {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: #10b981;
            border: 2px solid var(--card);
            border-radius: 50%;
            z-index: 2;
        }

        .info h1 { 
            font-size: 15px; 
            font-weight: 700; 
            line-height: 1.3;
            color: var(--text);
        }
        .position { font-size: 12px; color: var(--text-sec); margin-top: 3px; line-height: 1.4; }

        .content { padding: 14px 20px 18px; }

        .contacts { display: flex; flex-direction: column; gap: 6px; }

        .contact {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--item);
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .contact:hover { border-color: var(--accent); background: var(--accent-light); }
        .contact.copied { border-color: var(--accent); background: var(--accent-light); }

        .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon svg { width: 16px; height: 16px; color: var(--accent); }

        .contact-text { flex: 1; min-width: 0; }
        .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .value a { color: inherit; text-decoration: none; }

        .copy-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .copy-btn:hover { background: var(--accent-light); color: var(--accent); }
        .copy-btn svg { width: 14px; height: 14px; }

        .address {
            margin-top: 8px;
            padding: 10px 12px;
            background: var(--item);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            gap: 10px;
            font-size: 12px;
            color: var(--text-sec);
            line-height: 1.4;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            padding: 11px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--item);
            color: var(--text);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn:hover { border-color: var(--accent); background: var(--accent-light); }
        .btn svg { width: 15px; height: 15px; }

        .save-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .save-btn:hover { background: #1d4ed8; }
        .save-btn svg { width: 16px; height: 16px; }

        .footer { text-align: center; padding: 0 0 14px; }
        .footer a { font-size: 11px; color: var(--text-muted); text-decoration: none; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 12px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .card { animation: fadeIn 0.4s ease-out; }
    </style>
</head>

<script>
function copy(text, el) {
    navigator.clipboard.writeText(text).then(() => {
        el.classList.add('copied');
        showToast('Скопировано: ' + text);
        setTimeout(() => el.classList.remove('copied'), 1500);
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function saveContact() {
    const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Кинякин Александр Сергеевич
N:Кинякин;Александр;Сергеевич;;
ORG:ООО «НПФ ЭИТЭК»
TITLE:Технический директор
TEL;TYPE=WORK,VOICE:+74959261080;EXT=203
TEL;TYPE=CELL:+79175692777
EMAIL:kinyakin@eitek.ru
URL:https://www.eitek.ru
ADR;TYPE=WORK:;;ул. Ивана Бабушкина, д. 10;Москва;;117292;Россия
END:VCARD`;
    
    const blob = new Blob([vcard], {type: 'text/vcard'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Кинякин_Александр.vcf';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Контакт сохранён');
}
</script>
